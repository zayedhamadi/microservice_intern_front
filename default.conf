# =========================================================
# DEFAULT NGINX CONFIGURATION
# Angular + Gateway + WebSockets + Keycloak
# =========================================================


# =========================================================
# WEBSOCKET
# =========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# =========================================================
# RATE LIMITING
# =========================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;


# =========================================================
# SERVER
# =========================================================

server {

    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;


    # =====================================================
    # GZIP
    # =====================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;


    # =====================================================
    # SECURITY HEADERS
    # =====================================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;


    # =====================================================
    # CONTENT SECURITY POLICY
    #
    # Autorise :
    # - Angular
    # - Font Awesome
    # - Tabler Icons    
    # - Bootstrap Icons
    # - Google Material Icons
    # - Google Fonts
    # - Keycloak localhost:8180
    # - API via Nginx localhost:8080
    # - WebSocket via Nginx
    # =====================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 http://localhost:8180 ws://localhost:8080 ws://127.0.0.1:8080 ws://localhost:4200 ws://127.0.0.1:4200 wss:; frame-src 'self' http://localhost:8180; frame-ancestors 'self';" always;

    # =====================================================
    # STATIC FILES
    # =====================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {

        expires 7d;

        add_header Cache-Control "public, max-age=604800, immutable";

        try_files $uri =404;
    }


    # =====================================================
    # REST API
    #
    # Browser:
    #   http://localhost:8080/api/...
    #
    # Nginx:
    #   gateway:8080/api/...
    # =====================================================

    location /api/ {

        limit_req zone=api_limit burst=40 nodelay;

        client_max_body_size 10m;

        proxy_pass http://gateway:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;

        proxy_buffering off;
    }


    # =====================================================
    # AUTH ROUTES
    #
    # Browser:
    #   /auth/...
    #
    # Gateway:
    #   gateway:8080/auth/...
    # =====================================================

    location /auth/ {

        proxy_pass http://gateway:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;

        proxy_buffering off;
    }


    # =====================================================
    # EMPLOYEES ROUTES
    # =====================================================

    location /employees/ {

        proxy_pass http://gateway:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;

        proxy_buffering off;
    }


    # =====================================================
    # WEBSOCKET ADMIN
    #
    # Browser:
    #   ws://localhost:8080/ws-admin
    #
    # Nginx:
    #   user-service:8081/ws-admin
    # =====================================================

    location /ws-admin {

        proxy_pass http://user-service:8081;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;

        proxy_send_timeout 3600s;

        proxy_read_timeout 3600s;

        proxy_buffering off;

        proxy_cache_bypass $http_upgrade;
    }


    # =====================================================
    # WEBSOCKET RECRUTEMENT
    #
    # Browser:
    #   ws://localhost:8080/ws-recrutement
    #
    # Nginx:
    #   recrutement-service:8082/ws-recrutement
    # =====================================================

    location /ws-recrutement {

        proxy_pass http://recrutement-service:8082;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;

        proxy_send_timeout 3600s;

        proxy_read_timeout 3600s;

        proxy_buffering off;

        proxy_cache_bypass $http_upgrade;
    }


    # =====================================================
    # HEALTH CHECK
    # =====================================================

    location = /health {

        access_log off;

        default_type application/json;

        return 200 '{"status":"UP"}';
    }


    # =====================================================
    # ANGULAR SPA ROUTING
    # =====================================================

    location / {

        
         try_files $uri $uri/ /index.html;
         # try_files $uri /index.html;
    }


    # =====================================================
    # BLOCK HIDDEN FILES
    # =====================================================

    location ~ /\. {

        deny all;

        access_log off;

        log_not_found off;
    }
}